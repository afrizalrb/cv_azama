name: Deploy ke GitHub Pages

# Yang di-deploy hanya folder frontend/. Kode Apps Script di repo ini adalah
# arsip — yang benar-benar berjalan di Google adalah hasil `clasp push`,
# dan itu tidak pernah otomatis. Lihat README bagian "Deploy Apps Script".

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploy Pages tidak boleh berjalan dua kali bersamaan. Yang lebih baru menang.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pasang dependensi
        run: npm ci
        working-directory: frontend

      - name: Periksa VITE_API_URL sudah terpasang
        # Tanpa langkah ini, build tetap berhasil tapi situsnya tidak bisa
        # menghubungi backend sama sekali. Lebih baik gagal di sini, dengan
        # pesan yang menyebutkan persis apa yang kurang.
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Repository secret VITE_API_URL belum diisi."
            echo "Buka Settings > Secrets and variables > Actions > New repository secret."
            echo "Nama: VITE_API_URL, isi: URL web app Apps Script yang berakhiran /exec"
            exit 1
          fi
          echo "VITE_API_URL terpasang (${#VITE_API_URL} karakter)"

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
